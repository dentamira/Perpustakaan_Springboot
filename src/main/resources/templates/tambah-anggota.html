<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tambah Anggota</title>
</head>
<body>

<h1>Tambah Anggota</h1>

<nav>
    <a th:href="@{/buku}">Daftar Buku</a> |
    <a th:href="@{/anggota}">Daftar Anggota</a> |
    <a th:href="@{/peminjaman}">Daftar Peminjaman</a>
</nav>

<hr>

<p th:if="${error}" th:text="${error}" style="color: red;"></p>

<form th:action="@{/anggota/tambah}" method="post">
    <p>
        <label>ID Anggota:</label>
        <input type="text" name="idAnggota" required>
    </p>

    <p>
        <label>Nama:</label>
        <input type="text" name="nama" required>
    </p>

    <p>
        <label>Batas Pinjam:</label>
        <input type="number" name="batasPinjam" min="0" required>
    </p>

    <button type="submit">Simpan</button>
</form>

<p>
    <a th:href="@{/anggota}">Kembali ke Daftar Anggota</a>
</p>

</body>
</html>
