<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Anggota</title>
</head>
<body>

<h1>Daftar Anggota</h1>

<nav>
    <a th:href="@{/buku}">Daftar Buku</a> |
    <a th:href="@{/anggota}">Daftar Anggota</a> |
    <a th:href="@{/peminjaman}">Daftar Peminjaman</a>
</nav>

<hr>

<p th:if="${pesan}" th:text="${pesan}" style="color: green;"></p>
<p th:if="${error}" th:text="${error}" style="color: red;"></p>

<p>
    <a th:href="@{/anggota/tambah}">Tambah Anggota</a>
</p>

<h2>Data Anggota</h2>

<p th:if="${#lists.isEmpty(daftarAnggota)}">
    Belum ada anggota.
</p>

<table border="1" cellpadding="8"
       th:unless="${#lists.isEmpty(daftarAnggota)}">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nama</th>
            <th>Batas Pinjam</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="a : ${daftarAnggota}">
            <td th:text="${a.idAnggota}"></td>
            <td th:text="${a.nama}"></td>
            <td th:text="${a.batasPinjam}"></td>
        </tr>
    </tbody>
</table>

</body>
</html>
